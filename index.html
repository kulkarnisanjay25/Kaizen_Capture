<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaizen Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --font-label: 16px;
    --font-input: 20px;
    --font-button: 18px;
    --font-small: 14px;

    --color-bg:     #EEF3F6;
    --color-card:   #FFFFFF;
    --color-text:   #1A1F29;
    --color-muted:  #4B5566;
    --color-gold:   #C99A3B;
    --color-ink:    #152238;
    --color-line:   #DCE3E9;
    --color-ok:     #2E7D46;
    --color-err:    #C1440E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Inter',sans-serif;padding-bottom:60px;}
  .topbar{background:#fff;padding:22px 24px;border-bottom:3px solid var(--color-gold);}
  .topbar h1{font-family:'Space Grotesk',sans-serif;margin:0;font-size:26px;color:var(--color-ink);}
  .wrap{max-width:760px;margin:22px auto;padding:0 18px;}
  .card{background:var(--color-card);border:1px solid var(--color-line);border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(28,36,48,.06);}
  .card h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 16px;color:var(--color-ink);}

  .field{margin-bottom:22px;}
  .field label{display:block;font-size:var(--font-label);font-weight:600;color:var(--color-muted);margin-bottom:8px;}
  .field input[type=text], .field textarea{
    width:100%;border:1.5px solid var(--color-line);border-radius:10px;padding:14px 16px;
    font-size:var(--font-input);font-family:inherit;color:var(--color-text);background:var(--color-bg);
  }
  .field textarea{min-height:110px;resize:vertical;line-height:1.4;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--color-gold);outline-offset:1px;background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){ .row2{grid-template-columns:1fr;} }

  .btn{border:none;font-weight:700;font-size:var(--font-button);padding:14px 22px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn:disabled{opacity:.55;cursor:progress;}
  .btn-gold{background:var(--color-gold);color:var(--color-ink);width:100%;justify-content:center;}
  .btn-outline{background:#fff;color:var(--color-ink);border:1.5px solid var(--color-line);}
  .btn-sm{font-size:var(--font-small);padding:9px 14px;}

  input[type=file]{display:none;}
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;}
  .photo-preview{width:100%;max-height:260px;object-fit:contain;border:1px solid var(--color-line);border-radius:10px;margin-bottom:10px;display:none;background:#fafafa;}

  .status-line{margin-top:14px;font-size:var(--font-small);color:var(--color-muted);}
  .status-line.ok{color:var(--color-ok);font-weight:600;}
  .status-line.err{color:var(--color-err);font-weight:600;}
  .status-line.warn{color:#B07A1E;font-weight:600;}

  .continue-row{display:flex;justify-content:flex-end;margin-bottom:14px;}
  .uniq-preview{font-family:'IBM Plex Mono',monospace;font-size:var(--font-small);color:var(--color-muted);margin-top:6px;}
</style>
</head>
<body>

<div class="topbar"><h1>Kaizen Capture</h1></div>

<div class="wrap">

  <div class="continue-row">
    <button id="continueBtn" class="btn btn-outline btn-sm">🔄 Continue an Existing Kaizen</button>
    <input type="file" id="continueInput" accept=".pptx">
  </div>

  <div class="card">
    <h3>Details</h3>

    <div class="field">
      <label>Kaizen Title</label>
      <input type="text" id="f_title">
    </div>

    <div class="field">
      <label>Plant</label>
      <input type="text" id="f_plant">
    </div>

    <div class="field">
      <label>Department</label>
      <input type="text" id="f_department">
    </div>

    <div class="field">
      <label>Zone</label>
      <input type="text" id="f_area">
    </div>

    <div class="field">
      <label>Done By</label>
      <input type="text" id="f_doneBy">
    </div>

    <div class="field">
      <label>Category</label>
      <input type="text" id="f_category">
    </div>

    <div class="uniq-preview" id="uniqPreview"></div>
  </div>

  <div class="card">
    <h3>Before — Problem</h3>
    <div class="row2">
      <div class="field"><label>Date</label><input type="text" id="f_beforeDate" placeholder="DD/MM/YYYY"></div>
      <div class="field"><label>Time</label><input type="text" id="f_beforeTime" placeholder="HH:MM"></div>
    </div>
    <div class="field">
      <label>Problem</label>
      <textarea id="f_beforeText"></textarea>
    </div>
    <div class="field">
      <label>Before Photo</label>
      <img class="photo-preview" id="preview_before">
      <div class="photo-row">
        <button type="button" class="btn btn-outline" id="cam_before">📷 Camera</button>
        <button type="button" class="btn btn-outline" id="gal_before">🖼 Gallery</button>
        <input type="file" accept="image/*" capture="environment" id="camInput_before">
        <input type="file" accept="image/*" id="galInput_before">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>After — Solution</h3>
    <div class="row2">
      <div class="field"><label>Date</label><input type="text" id="f_afterDate" placeholder="DD/MM/YYYY"></div>
      <div class="field"><label>Time</label><input type="text" id="f_afterTime" placeholder="HH:MM"></div>
    </div>
    <div class="field">
      <label>Solution</label>
      <textarea id="f_afterText"></textarea>
    </div>
    <div class="field">
      <label>After Photo</label>
      <img class="photo-preview" id="preview_after">
      <div class="photo-row">
        <button type="button" class="btn btn-outline" id="cam_after">📷 Camera</button>
        <button type="button" class="btn btn-outline" id="gal_after">🖼 Gallery</button>
        <input type="file" accept="image/*" capture="environment" id="camInput_after">
        <input type="file" accept="image/*" id="galInput_after">
      </div>
    </div>
  </div>

  <div class="card">
    <button id="submitBtn" class="btn btn-gold">⬇ Download Kaizen PPT</button>
    <div class="status-line" id="statusLine"></div>
  </div>

</div>

const SLIDE_KEY = 'ppt/slides/slide1.xml';

function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function findShapeBlockByName(xml, name){
  const re = /<p:sp>[\s\S]*?<\/p:sp>/g;
  let m;
  const safe = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const nameRe = new RegExp(`name="${safe}"`);
  while((m = re.exec(xml))){
    if(nameRe.test(m[0])) return { block: m[0], index: m.index };
  }
  return null;
}

// Forces "shrink text on overflow" so a value that's too long for its box shrinks
// rather than spilling into the next shape.
function ensureAutofitBodyPr(bodyPrXml){
  if(!bodyPrXml) return '<a:bodyPr><a:normAutofit/></a:bodyPr>';
  let b = bodyPrXml.replace(/<a:(noAutofit|normAutofit|spAutoFit)\s*\/>/g, '');
  if(/\/>\s*$/.test(b)){
    b = b.replace(/\/>\s*$/, '><a:normAutofit/></a:bodyPr>');
  } else {
    b = b.replace('</a:bodyPr>', '<a:normAutofit/></a:bodyPr>');
  }
  return b;
}

function replaceWholeShapeText(spBlock, value){
  const tbMatch = spBlock.match(/<p:txBody>([\s\S]*?)<\/p:txBody>/);
  if(!tbMatch) return spBlock;
  const tbInner = tbMatch[1];
  const bodyPrMatch = tbInner.match(/<a:bodyPr[^>]*(?:\/>|>[\s\S]*?<\/a:bodyPr>)/);
  const lstStyleMatch = tbInner.match(/<a:lstStyle\s*\/>|<a:lstStyle>[\s\S]*?<\/a:lstStyle>/);
  const firstParaMatch = tbInner.match(/<a:p>[\s\S]*?<\/a:p>/);
  let rPr = '', pPr = '';
  if(firstParaMatch){
    const pPrMatch = firstParaMatch[0].match(/<a:pPr[^>]*(?:\/>|>[\s\S]*?<\/a:pPr>)/);
    pPr = pPrMatch ? pPrMatch[0] : '';
    const runMatch = firstParaMatch[0].match(/<a:r>((?:<a:rPr[^>]*\/>)|(?:<a:rPr[^>]*>[\s\S]*?<\/a:rPr>))?<a:t>/);
    rPr = runMatch ? (runMatch[1] || '') : '';
  }
  const bodyPr = ensureAutofitBodyPr(bodyPrMatch ? bodyPrMatch[0] : null);
  const runsXml = String(value).split('\n').map(line => `<a:r>${rPr}<a:t>${escapeXml(line)}</a:t></a:r>`).join('<a:br/>');
  const newTb = `<p:txBody>${bodyPr}${lstStyleMatch ? lstStyleMatch[0] : '<a:lstStyle/>'}<a:p>${pPr}${runsXml}</a:p></p:txBody>`;
  return spBlock.replace(tbMatch[0], newTb);
}

function findShapeBlockByText(xml, exactText){
  const re = /<p:sp>[\s\S]*?<\/p:sp>/g;
  let m;
  while((m = re.exec(xml))){
    const tb = m[0].match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
    if(!tb) continue;
    const text = [...tb[0].matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(x => x[1]).join('');
    if(text === exactText) return { block: m[0], index: m.index };
  }
  return null;
}

// Moves/resizes a shape found by exact name or exact text. Pass cx/cy as null to
// move only (keep original size).
async function repositionShape(zip, slideKey, { byName, byText } = {}, x, y, cx, cy){
  let xml = await zip.files[slideKey].async('string');
  const found = byName ? findShapeBlockByName(xml, byName) : findShapeBlockByText(xml, byText);
  if(!found) return false;
  let block = found.block;
  block = block.replace(/<a:off x="-?\d+" y="-?\d+"\s*\/>/, `<a:off x="${x}" y="${y}"/>`);
  if(cx != null && cy != null){
    block = block.replace(/<a:ext cx="\d+" cy="\d+"\s*\/>/, `<a:ext cx="${cx}" cy="${cy}"/>`);
  }
  xml = xml.slice(0, found.index) + block + xml.slice(found.index + found.block.length);
  zip.file(slideKey, xml);
  return true;
}

async function setFieldText(zip, slideKey, shapeName, value){
  let xml = await zip.files[slideKey].async('string');
  const found = findShapeBlockByName(xml, shapeName);
  if(!found) return false;
  const newBlock = replaceWholeShapeText(found.block, value || '');
  xml = xml.slice(0, found.index) + newBlock + xml.slice(found.index + found.block.length);
  zip.file(slideKey, xml);
  return true;
}

async function getFieldText(zip, slideKey, shapeName){
  const xml = await zip.files[slideKey].async('string');
  const found = findShapeBlockByName(xml, shapeName);
  if(!found) return '';
  const tb = found.block.match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
  if(!tb) return '';
  const texts = [...tb[0].matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m => m[1]);
  const breaks = (tb[0].match(/<a:br\s*\/>/g) || []).length;
  // crude but good enough: join runs, treating each <a:br/> boundary as a newline
  const parts = tb[0].split(/<a:br\s*\/>/);
  const lines = parts.map(p => [...p.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m => m[1]).join(''));
  return lines.join('\n')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}

async function addNewFieldFromTemplate(zip, slideKey, templateShapeName, newShapeName, x, y, cx, cy, initialValue){
  let xml = await zip.files[slideKey].async('string');
  if(findShapeBlockByName(xml, newShapeName)) return true; // already added (e.g. re-run)
  const found = findShapeBlockByName(xml, templateShapeName);
  if(!found) return false;
  let block = found.block;
  const ids = [...xml.matchAll(/<p:cNvPr id="(\d+)"/g)].map(m => parseInt(m[1],10));
  const newId = Math.max(...ids) + 1;
  block = block.replace(/<p:cNvPr id="\d+" name="[^"]*"/, `<p:cNvPr id="${newId}" name="${newShapeName}"`);
  block = block.replace(/<a:off x="-?\d+" y="-?\d+"\s*\/>/, `<a:off x="${x}" y="${y}"/>`);
  block = block.replace(/<a:ext cx="\d+" cy="\d+"\s*\/>/, `<a:ext cx="${cx}" cy="${cy}"/>`);
  block = replaceWholeShapeText(block, initialValue || '');
  xml = xml.slice(0, found.index + found.block.length) + block + xml.slice(found.index + found.block.length);
  zip.file(slideKey, xml);
  return true;
}

async function nextMediaIndex(zip){
  const nums = Object.keys(zip.files).map(k => k.match(/^ppt\/media\/image(\d+)\./)).filter(Boolean).map(m => parseInt(m[1], 10));
  return (nums.length ? Math.max(...nums) : 0) + 1;
}
async function nextShapeIdFromXml(xml){
  const ids = [...xml.matchAll(/<p:cNvPr id="(\d+)"/g)].map(m => parseInt(m[1],10));
  return (ids.length ? Math.max(...ids) : 0) + 1;
}
async function ensureContentType(zip, ext, contentType){
  const key = '[Content_Types].xml';
  let xml = await zip.files[key].async('string');
  if(!new RegExp(`Extension="${ext}"`).test(xml)){
    xml = xml.replace('</Types>', `<Default Extension="${ext}" ContentType="${contentType}"/></Types>`);
    zip.file(key, xml);
  }
}
async function addImageAsset(zip, slideKey, dataUrl){
  const idx = await nextMediaIndex(zip);
  const mime = dataUrl.slice(5, dataUrl.indexOf(';'));
  const ext = mime === 'image/png' ? 'png' : 'jpeg';
  const base64 = dataUrl.split(',')[1];
  zip.file(`ppt/media/image${idx}.${ext}`, base64, { base64: true });
  await ensureContentType(zip, ext, `image/${ext}`);
  const relsKey = slideKey.replace(/^ppt\/slides\/(slide\d+\.xml)$/, 'ppt/slides/_rels/$1.rels');
  let relsXml = zip.files[relsKey]
    ? await zip.files[relsKey].async('string')
    : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  const existingIds = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m => parseInt(m[1],10));
  const rId = 'rId' + ((existingIds.length ? Math.max(...existingIds) : 0) + 1);
  relsXml = relsXml.replace('</Relationships>',
    `<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${idx}.${ext}"/></Relationships>`);
  zip.file(relsKey, relsXml);
  return { rId, ext, idx };
}

async function insertFixedPhoto(zip, slideKey, frameShapeName, labelShapeName, x, y, cx, cy, dataUrl, altTextTag){
  let xml = await zip.files[slideKey].async('string');
  const frame = findShapeBlockByName(xml, frameShapeName);
  const label = findShapeBlockByName(xml, labelShapeName);
  if(!frame) return false;
  const { rId } = await addImageAsset(zip, slideKey, dataUrl);
  const shapeId = await nextShapeIdFromXml(xml);
  const picXml = `<p:pic><p:nvPicPr><p:cNvPr id="${shapeId}" name="${frameShapeName}_photo" descr="${altTextTag}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
  const blocks = [frame, label].filter(Boolean).sort((a,b) => b.index - a.index);
  let newXml = xml;
  blocks.forEach(b => { newXml = newXml.slice(0, b.index) + newXml.slice(b.index + b.block.length); });
  const insertAt = Math.min(frame.index, label ? label.index : frame.index);
  newXml = newXml.slice(0, insertAt) + picXml + newXml.slice(insertAt);
  zip.file(slideKey, newXml);
  return true;
}

// finds an existing <p:pic> tagged with the given altText prefix (e.g. "B_") and
// returns its image bytes as a data URL, for the "Continue" flow
async function findExistingPhotoDataUrl(zip, slideKey, altPrefix){
  const xml = await zip.files[slideKey].async('string');
  const pics = [...xml.matchAll(/<p:pic>[\s\S]*?<\/p:pic>/g)];
  const target = pics.find(m => {
    const d = m[0].match(/descr="([^"]*)"/);
    return d && d[1].startsWith(altPrefix);
  });
  if(!target) return null;
  const rIdMatch = target[0].match(/r:embed="([^"]+)"/);
  if(!rIdMatch) return null;
  const relsKey = slideKey.replace(/^ppt\/slides\/(slide\d+\.xml)$/, 'ppt/slides/_rels/$1.rels');
  const relsXml = await zip.files[relsKey].async('string');
  const relMatch = relsXml.match(new RegExp(`Id="${rIdMatch[1]}"[^>]*Target="([^"]+)"`));
  if(!relMatch) return null;
  const mediaPath = 'ppt/' + relMatch[1].replace(/^\.\.\//, '');
  const ext = mediaPath.split('.').pop().toLowerCase();
  const mime = ext === 'png' ? 'image/png' : 'image/jpeg';
  const base64 = await zip.files[mediaPath].async('base64');
  return `data:${mime};base64,${base64}`;
}

// ================= Unique No. generator =================
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad2(n){ return n.toString().padStart(2,'0'); }
function generateUniqueNo(){
  const d = new Date();
  return `${pad2(d.getDate())}${MONTHS[d.getMonth()]}${String(d.getFullYear()).slice(-2)}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
}
function sanitizePart(s){
  return (s || 'NA').toString().trim().replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'') || 'NA';
}

function tickUniqPreview(){
  document.getElementById('uniqPreview').textContent = `Unique No. (auto, generated on download): ${generateUniqueNo()}`;
}
setInterval(tickUniqPreview, 1000);
tickUniqPreview();

// Default Before/After date & time to "now" so the common case needs no typing;
// still fully editable (e.g. if logging a kaizen a day after it happened).
(function defaultDateTime(){
  const d = new Date();
  const dateStr = `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
  const timeStr = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  ['f_beforeDate','f_afterDate'].forEach(id => { document.getElementById(id).value = dateStr; });
  ['f_beforeTime','f_afterTime'].forEach(id => { document.getElementById(id).value = timeStr; });
})();

// ================= image resize =================
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = e.target.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let photoData = { before: null, after: null };

function wirePhotoButtons(prefix){
  const preview = document.getElementById(`preview_${prefix}`);
  const wire = (btnId, inputId) => {
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 1600, 0.82);
        photoData[prefix] = dataUrl;
        preview.src = dataUrl;
        preview.style.display = 'block';
      } catch(err){ console.error(err); }
    });
  };
  wire(`cam_${prefix}`, `camInput_${prefix}`);
  wire(`gal_${prefix}`, `galInput_${prefix}`);
}
wirePhotoButtons('before');
wirePhotoButtons('after');

// ================= field <-> shape map =================
const TEXT_FIELD_MAP = [
  ['f_title', 'KZCAP_FIELD_kaizenTitle'],
  ['f_plant', 'KZCAP_FIELD_plant'],
  ['f_department', 'KZCAP_FIELD_department'],
  ['f_area', 'KZCAP_FIELD_area'],
  ['f_doneBy', 'KZCAP_FIELD_preparedBy'],
  ['f_category', 'KZCAP_FIELD_category'],
  ['f_beforeDate', 'KZCAP_FIELD_beforeDate'],
  ['f_beforeTime', 'KZCAP_FIELD_beforeTime'],
  ['f_beforeText', 'KZCAP_FIELD_beforeText'],
  ['f_afterDate', 'KZCAP_FIELD_afterDate'],
  ['f_afterTime', 'KZCAP_FIELD_afterTime'],
  ['f_afterText', 'KZCAP_FIELD_afterText'],
];
const FIELD_LABELS = {
  uniqueNo: 'Unique No.', title: 'Title', plant: 'Plant', department: 'Department', area: 'Zone',
  doneBy: 'Done By', category: 'Category',
  beforeDate: 'Before Date', beforeTime: 'Before Time', beforeText: 'Before Problem',
  afterDate: 'After Date', afterTime: 'After Time', afterText: 'After Solution'
};

function base64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function loadTemplateZip(){
  const bytes = base64ToBytes(TEMPLATE_BASE64);
  return JSZip.loadAsync(bytes);
}

// ================= Continue an existing Kaizen =================
document.getElementById('continueBtn').addEventListener('click', () => document.getElementById('continueInput').click());
document.getElementById('continueInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  const status = document.getElementById('statusLine');
  if(!file) return;
  status.textContent = 'Reading existing file...';
  status.className = 'status-line';
  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);

    for(const [elId, shapeName] of TEXT_FIELD_MAP){
      const val = await getFieldText(zip, SLIDE_KEY, shapeName);
      document.getElementById(elId).value = val || '';
    }

    const beforeUrl = await findExistingPhotoDataUrl(zip, SLIDE_KEY, 'B_');
    if(beforeUrl){
      photoData.before = beforeUrl;
      const p = document.getElementById('preview_before'); p.src = beforeUrl; p.style.display = 'block';
    }
    const afterUrl = await findExistingPhotoDataUrl(zip, SLIDE_KEY, 'A_');
    if(afterUrl){
      photoData.after = afterUrl;
      const p = document.getElementById('preview_after'); p.src = afterUrl; p.style.display = 'block';
    }

    status.textContent = `Loaded "${file.name}" ✓ — edit and download again when ready.`;
    status.className = 'status-line ok';
  } catch(err){
    console.error(err);
    status.textContent = 'Could not read that file — is it a Kaizen Capture PPT?';
    status.className = 'status-line err';
  }
  e.target.value = '';
});

// ================= Google Sheet logging (best-effort, never blocks the download) =================
async function logToGoogleSheet(values){
  if(!GOOGLE_SHEET_WEBAPP_URL) return { skipped: true };
  try{
    await fetch(GOOGLE_SHEET_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight Apps Script can't answer
      body: JSON.stringify(values)
    });
    return { ok: true };
  } catch(err){
    console.error('Google Sheet logging failed:', err);
    return { ok: false, error: err };
  }
}

// ================= Submit =================
document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('statusLine');
  btn.disabled = true;
  status.textContent = 'Building your file...';
  status.className = 'status-line';

  try{
    if(typeof JSZip === 'undefined') throw new Error('File library failed to load — check your internet connection.');

    const values = {};
    TEXT_FIELD_MAP.forEach(([elId]) => { values[elId.replace('f_','')] = document.getElementById(elId).value || ''; });
    const uniqueNo = generateUniqueNo();
    values.uniqueNo = uniqueNo;

    const zip = await loadTemplateZip();

    // --- layout fix: the template's Plant/Dept/Zone/Done By/Category row was too
    // crowded for 5 fields at their original widths, causing text to overlap its
    // neighbors. Each value box below is resized to sit squarely in the gap between
    // its own label and the next label, all within the original row (no shapes moved
    // to a new row, so there's no risk of colliding with the Before/After section).
    await repositionShape(zip, SLIDE_KEY, { byName: 'KZCAP_FIELD_plant' },      1234440, 960120, 1097280, 320040);
    await repositionShape(zip, SLIDE_KEY, { byName: 'KZCAP_FIELD_department' }, 3429000, 960120, 973836,  320040);
    await repositionShape(zip, SLIDE_KEY, { byName: 'KZCAP_FIELD_area' },       5257800, 960120, 932688,  320040);
    await repositionShape(zip, SLIDE_KEY, { byName: 'KZCAP_FIELD_preparedBy' }, 8037575, 960120, 932688,  320040);

    for(const [elId, shapeName] of TEXT_FIELD_MAP){
      await setFieldText(zip, SLIDE_KEY, shapeName, document.getElementById(elId).value || '');
    }
    await setFieldText(zip, SLIDE_KEY, 'KZCAP_FIELD_kaizenNo', uniqueNo);
    await addNewFieldFromTemplate(zip, SLIDE_KEY, 'KZCAP_FIELD_area', 'KZCAP_FIELD_category',
      10323576, 960120, 1499616, 320040, document.getElementById('f_category').value || '');
    // addNewFieldFromTemplate above only creates the shape if missing; make sure its text/position is current
    await setFieldText(zip, SLIDE_KEY, 'KZCAP_FIELD_category', document.getElementById('f_category').value || '');
    await repositionShape(zip, SLIDE_KEY, { byName: 'KZCAP_FIELD_category' }, 10323576, 960120, 1499616, 320040);

    if(photoData.before){
      await insertFixedPhoto(zip, SLIDE_KEY, 'Shape 15', 'Text 16', 365760, 2103120, 5349240, 2743200, photoData.before, `B_${uniqueNo}`);
    }
    if(photoData.after){
      await insertFixedPhoto(zip, SLIDE_KEY, 'Shape 25', 'Text 26', 6016752, 2103120, 5349240, 2743200, photoData.after, `A_${uniqueNo}`);
    }

    // hidden notes-slide metadata, for a Summary Builder tool to read later
    const notesKeys = Object.keys(zip.files).filter(k => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(k));
    if(notesKeys.length){
      const notesKey = notesKeys[0];
      let nxml = await zip.files[notesKey].async('string');
      const payload = { app: 'kaizen-capture-template', template: 'KaizenCapture', generatedAt: new Date().toISOString(), fields: {}, fieldLabels: FIELD_LABELS, photos: {} };
      Object.keys(values).forEach(k => payload.fields[k] = values[k]);
      payload.photos.before_photo = !!photoData.before;
      payload.photos.after_photo = !!photoData.after;
      const marker = `KZCAP_DATA_START${JSON.stringify(payload)}KZCAP_DATA_END`;
      const phMatch = nxml.match(/<p:sp>(?:(?!<\/p:sp>)[\s\S])*?<p:ph type="body"[^>]*\/>[\s\S]*?<\/p:sp>/);
      if(phMatch){
        const tbMatch = phMatch[0].match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
        if(tbMatch){
          const newPara = `<a:p><a:r><a:rPr lang="en-US" sz="100"/><a:t>${escapeXml(marker)}</a:t></a:r></a:p>`;
          const newTb = tbMatch[0].replace('</p:txBody>', newPara + '</p:txBody>');
          nxml = nxml.replace(phMatch[0], phMatch[0].replace(tbMatch[0], newTb));
          zip.file(notesKey, nxml);
        }
      }
    }

    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    const fileName = `${sanitizePart(values.doneBy)}_${sanitizePart(values.department)}_${sanitizePart(values.plant)}_${uniqueNo}.pptx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    const sheetResult = await logToGoogleSheet(values);
    if(sheetResult.skipped){
      status.textContent = `Downloaded ${fileName} ✓ (Google Sheet logging not configured)`;
      status.className = 'status-line ok';
    } else if(sheetResult.ok){
      status.textContent = `Downloaded ${fileName} ✓ — logged to Google Sheet ✓`;
      status.className = 'status-line ok';
    } else {
      status.textContent = `Downloaded ${fileName} ✓ (Google Sheet logging failed — check the Web App URL)`;
      status.className = 'status-line warn';
    }
  } catch(err){
    console.error(err);
    status.textContent = err.message || 'Something went wrong — see console.';
    status.className = 'status-line err';
  } finally {
    btn.disabled = false;
  }
});
