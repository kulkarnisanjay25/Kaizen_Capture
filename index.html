<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaizen Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --font-label: 16px; --font-input: 20px; --font-button: 18px; --font-small: 14px;
    --color-bg:#EEF3F6; --color-card:#FFFFFF; --color-text:#1A1F29; --color-muted:#4B5566;
    --color-gold:#C99A3B; --color-ink:#152238; --color-line:#DCE3E9; --color-ok:#2E7D46; --color-err:#C1440E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Inter',sans-serif;padding-bottom:60px;}
  .topbar{background:#fff;padding:22px 24px;border-bottom:3px solid var(--color-gold);}
  .topbar h1{font-family:'Space Grotesk',sans-serif;margin:0;font-size:26px;color:var(--color-ink);}
  .wrap{max-width:760px;margin:22px auto;padding:0 18px;}
  .card{background:var(--color-card);border:1px solid var(--color-line);border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(28,36,48,.06);}
  .card h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 16px;color:var(--color-ink);}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:var(--font-label);font-weight:600;color:var(--color-muted);margin-bottom:8px;}
  .field input[type=text], .field textarea{
    width:100%;border:1.5px solid var(--color-line);border-radius:10px;padding:14px 16px;
    font-size:var(--font-input);font-family:inherit;color:var(--color-text);background:var(--color-bg);
  }
  .field textarea{min-height:110px;resize:vertical;line-height:1.4;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--color-gold);outline-offset:1px;background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){ .row2{grid-template-columns:1fr;} }
  .btn{border:none;font-weight:700;font-size:var(--font-button);padding:14px 22px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn:disabled{opacity:.55;cursor:progress;}
  .btn-gold{background:var(--color-gold);color:var(--color-ink);width:100%;justify-content:center;}
  .btn-outline{background:#fff;color:var(--color-ink);border:1.5px solid var(--color-line);}
  .btn-sm{font-size:var(--font-small);padding:9px 14px;}
  input[type=file]{display:none;}
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;}
  .photo-preview{width:100%;max-height:260px;object-fit:contain;border:1px solid var(--color-line);border-radius:10px;margin-bottom:10px;display:none;background:#fafafa;}
  .status-line{margin-top:14px;font-size:var(--font-small);color:var(--color-muted);}
  .status-line.ok{color:var(--color-ok);font-weight:600;}
  .status-line.err{color:var(--color-err);font-weight:600;}
  .status-line.warn{color:#B07A1E;font-weight:600;}
  .continue-row{display:flex;justify-content:flex-end;margin-bottom:14px;}
  .uniq-preview{font-family:monospace;font-size:var(--font-small);color:var(--color-muted);margin-top:6px;}
</style>
</head>
<body>

<div class="topbar"><h1>Kaizen Capture</h1></div>

<div class="wrap">
  <div class="continue-row">
    <button id="continueBtn" class="btn btn-outline btn-sm">🔄 Continue an Existing Kaizen</button>
    <input type="file" id="continueInput" accept=".pptx">
  </div>

  <div class="card">
    <h3>Details</h3>
    <div id="dynamicTagFields"></div>

    <div class="field"><label>Plant</label><input type="text" id="f_plant"></div>
    <div class="field"><label>Area</label><input type="text" id="f_area"></div>
    <div class="field"><label>Category</label><input type="text" id="f_category"></div>
    <div class="field"><label>Dept</label><input type="text" id="f_dept"></div>
    <div class="field"><label>Done By</label><input type="text" id="f_doneBy"></div>
    <div class="field"><label>Zone</label><input type="text" id="f_zone"></div>

    <div class="uniq-preview" id="uniqPreview"></div>
  </div>

  <div class="card">
    <h3>Before — Problem</h3>
    <div class="row2">
      <div class="field"><label>Date</label><input type="text" id="f_beforeDate" placeholder="DD/MM/YYYY"></div>
      <div class="field"><label>Time</label><input type="text" id="f_beforeTime" placeholder="HH:MM"></div>
    </div>
    <div class="field"><label>Problem</label><textarea id="f_beforeText"></textarea></div>
    <div class="field">
      <label>Before Photo</label>
      <img class="photo-preview" id="preview_before">
      <div class="photo-row">
        <button type="button" class="btn btn-outline" id="cam_before">📷 Camera</button>
        <button type="button" class="btn btn-outline" id="gal_before">🖼 Gallery</button>
        <input type="file" accept="image/*" capture="environment" id="camInput_before">
        <input type="file" accept="image/*" id="galInput_before">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>After — Solution</h3>
    <div class="row2">
      <div class="field"><label>Date</label><input type="text" id="f_afterDate" placeholder="DD/MM/YYYY"></div>
      <div class="field"><label>Time</label><input type="text" id="f_afterTime" placeholder="HH:MM"></div>
    </div>
    <div class="field"><label>Solution</label><textarea id="f_afterText"></textarea></div>
    <div class="field">
      <label>After Photo</label>
      <img class="photo-preview" id="preview_after">
      <div class="photo-row">
        <button type="button" class="btn btn-outline" id="cam_after">📷 Camera</button>
        <button type="button" class="btn btn-outline" id="gal_after">🖼 Gallery</button>
        <input type="file" accept="image/*" capture="environment" id="camInput_after">
        <input type="file" accept="image/*" id="galInput_after">
      </div>
    </div>
  </div>

  <div class="card">
    <button id="submitBtn" class="btn btn-gold">⬇ Download Kaizen PPT</button>
    <div class="status-line" id="statusLine"></div>
  </div>
</div>

    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'')
    .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\uD800-\uDFFF]/g, m => m.length === 2 ? m : '');
}
/* Normalise every kind of line-break to \n, then strip illegal characters */
function cleanText(s){
  return stripInvalidXml(String(s).replace(/\r\n?|\u000B|\u2028|\u2029/g,'\n'));
}
function escapeXml(s){
  return stripInvalidXml(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

/* ---------- run/paragraph model (tags split across runs/paragraphs resolve as one) ---------- */
function extractRuns(paraXml){
  const re = /<a:r>((?:<a:rPr[^>]*\/>)|(?:<a:rPr[^>]*>[\s\S]*?<\/a:rPr>))?<a:t>([\s\S]*?)<\/a:t><\/a:r>/g;
  const runs = []; let m;
  while((m = re.exec(paraXml))){ runs.push({ full: m[0], rPr: m[1] || '', text: m[2] }); }
  return runs;
}
function extractParagraphs(txBodyXml){
  const re = /<a:p>[\s\S]*?<\/a:p>/g;
  const paras = []; let m;
  while((m = re.exec(txBodyXml))){ paras.push({ full: m[0], index: m.index }); }
  return paras;
}
function getPPr(paraXml){
  const m = paraXml.match(/<a:pPr[^>]*(?:\/>|>[\s\S]*?<\/a:pPr>)/);
  return m ? m[0] : '';
}
function buildFlatModel(txBodyXml){
  const paragraphs = extractParagraphs(txBodyXml);
  const flatRuns = []; const runStartOffsets = []; let fullText = '';
  paragraphs.forEach((p, pIdx) => {
    if(pIdx > 0){ fullText += ' '; }
    extractRuns(p.full).forEach(r => {
      runStartOffsets.push(fullText.length);
      flatRuns.push({ ...r, paraIdx: pIdx });
      fullText += r.text;
    });
  });
  return { paragraphs, flatRuns, fullText, runStartOffsets };
}
function findTagSpan(fullText){
  const m = fullText.match(/\{\{\s*([^{}]+?)\s*\}\}/);
  if(!m) return null;
  return { tag: m[1], start: m.index, end: m.index + m[0].length };
}
function locateRunForOffset(runStartOffsets, flatRuns, offset){
  for(let i = 0; i < flatRuns.length; i++){
    const s = runStartOffsets[i], e = s + flatRuns[i].text.length;
    if(offset >= s && offset < e) return i;
  }
  return offset <= 0 ? 0 : flatRuns.length - 1;
}
function buildRunXml(rPr, text){ return `<a:r>${rPr}<a:t>${text}</a:t></a:r>`; }
function buildValueRunsXml(rPr, value){
  return cleanText(value).split('\n').map(escapeXml).map(line => buildRunXml(rPr, line)).join('<a:br/>');
}
function replaceTagInTxBody(txBodyXml, newValue){
  const model = buildFlatModel(txBodyXml);
  const span = findTagSpan(model.fullText);
  if(!span) return null;
  const firstRunIdx = locateRunForOffset(model.runStartOffsets, model.flatRuns, span.start);
  const lastRunIdx = locateRunForOffset(model.runStartOffsets, model.flatRuns, span.end - 1);
  const firstRun = model.flatRuns[firstRunIdx], lastRun = model.flatRuns[lastRunIdx];
  const firstParaIdx = firstRun.paraIdx, lastParaIdx = lastRun.paraIdx;
  const prefixLen = Math.max(0, span.start - model.runStartOffsets[firstRunIdx]);
  const prefix = firstRun.text.slice(0, prefixLen);
  const suffixStart = Math.max(0, span.end - model.runStartOffsets[lastRunIdx]);
  const suffix = lastRun.text.slice(suffixStart);
  const runsBefore = model.flatRuns.filter((r,i) => r.paraIdx === firstParaIdx && i < firstRunIdx);
  const runsAfter = model.flatRuns.filter((r,i) => r.paraIdx === lastParaIdx && i > lastRunIdx);
  const pPr = getPPr(model.paragraphs[firstParaIdx].full);
  let inner = pPr;
  inner += runsBefore.map(r => r.full).join('');
  if(prefix) inner += buildRunXml(firstRun.rPr, prefix);
  inner += buildValueRunsXml(firstRun.rPr, newValue);
  if(suffix) inner += buildRunXml(lastRun.rPr, suffix);
  inner += runsAfter.map(r => r.full).join('');
  const newParaXml = `<a:p>${inner}</a:p>`;
  const startIdx = model.paragraphs[firstParaIdx].index;
  const endIdx = model.paragraphs[lastParaIdx].index + model.paragraphs[lastParaIdx].full.length;
  return txBodyXml.slice(0, startIdx) + newParaXml + txBodyXml.slice(endIdx);
}

/* ---------- discover {{tag}} fields anywhere on the slide ---------- */
function slugify(tag){ return tag.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
async function discoverTagFields(zip, excludePattern){
  const xml = await zip.files[SLIDE_KEY].async('string');
  const found = [];
  [...xml.matchAll(/<p:sp>[\s\S]*?<\/p:sp>/g)].forEach(m => {
    const tb = m[0].match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
    if(!tb) return;
    const span = findTagSpan(buildFlatModel(tb[0]).fullText);
    if(!span || (excludePattern && excludePattern.test(span.tag))) return;
    found.push({ tag: span.tag, key: slugify(span.tag), contextType: 'shape' });
  });
  [...xml.matchAll(/<a:tc(?:\s[^>]*)?>[\s\S]*?<\/a:tc>/g)].forEach(m => {
    const tb = m[0].match(/<a:txBody>[\s\S]*?<\/a:txBody>/);
    if(!tb) return;
    const span = findTagSpan(buildFlatModel(tb[0]).fullText);
    if(!span || (excludePattern && excludePattern.test(span.tag))) return;
    found.push({ tag: span.tag, key: slugify(span.tag), contextType: 'cell' });
  });
  return found;
}
async function setTagField(zip, field, value){
  let xml = await zip.files[SLIDE_KEY].async('string');
  const containerRe = field.contextType === 'shape' ? /<p:sp>[\s\S]*?<\/p:sp>/g : /<a:tc(?:\s[^>]*)?>[\s\S]*?<\/a:tc>/g;
  const tbTag = field.contextType === 'shape' ? 'p:txBody' : 'a:txBody';
  const tbRe = new RegExp(`<${tbTag}>[\\s\\S]*?<\\/${tbTag}>`);
  const blocks = [...xml.matchAll(containerRe)];
  const target = blocks.find(m => {
    const tb = m[0].match(tbRe);
    if(!tb) return false;
    const span = findTagSpan(buildFlatModel(tb[0]).fullText);
    return span && span.tag === field.tag;
  });
  if(!target) return false;
  const block = target[0];
  const tb = block.match(tbRe)[0];
  const newTb = replaceTagInTxBody(tb, value);
  if(!newTb) return false;
  xml = xml.replace(block, () => block.replace(tb, () => newTb));
  zip.file(SLIDE_KEY, xml);
  return true;
}

/* ---------- plain-caption fields: label stays, value gets appended after it ---------- */
function findBlockByExactText(xml, exactText){
  const candidates = [
    ...[...xml.matchAll(/<p:sp>[\s\S]*?<\/p:sp>/g)].map(m => ({ m, tbTag: 'p:txBody' })),
    ...[...xml.matchAll(/<a:tc(?:\s[^>]*)?>[\s\S]*?<\/a:tc>/g)].map(m => ({ m, tbTag: 'a:txBody' })),
  ];
  for(const { m, tbTag } of candidates){
    const tbRe = new RegExp(`<${tbTag}>[\\s\\S]*?<\\/${tbTag}>`);
    const tb = m[0].match(tbRe);
    if(!tb) continue;
    const text = [...tb[0].matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(x => x[1]).join('');
    if(text === exactText) return { block: m[0], index: m.index, tbTag };
  }
  return null;
}
async function appendValueToLabel(zip, labelText, value, separator){
  if(!value) return false;
  let xml = await zip.files[SLIDE_KEY].async('string');
  const found = findBlockByExactText(xml, labelText);
  if(!found) return false;
  const tbRe = new RegExp(`<${found.tbTag}>[\\s\\S]*?<\\/${found.tbTag}>`);
  const tb = found.block.match(tbRe)[0];
  const firstParaMatch = tb.match(/<a:p>[\s\S]*?<\/a:p>/);
  if(!firstParaMatch) return false;
  const runs = extractRuns(firstParaMatch[0]);
  if(!runs.length) return false;
  const lastRun = runs[runs.length - 1];
  const newRunXml = `<a:r>${lastRun.rPr}<a:t>${escapeXml(separator)}</a:t></a:r>` + buildValueRunsXml(lastRun.rPr, value);
  const newPara = firstParaMatch[0].replace(lastRun.full, () => lastRun.full + newRunXml);
  const newTb = tb.replace(firstParaMatch[0], () => newPara);
  const newBlock = found.block.replace(tb, () => newTb);
  xml = xml.slice(0, found.index) + newBlock + xml.slice(found.index + found.block.length);
  zip.file(SLIDE_KEY, xml);
  return true;
}

/* ---------- named-shape fields (Before/After date/time/text, kaizen number) ---------- */
function findShapeBlockByName(xml, name){
  const re = /<p:sp>[\s\S]*?<\/p:sp>/g;
  let m;
  const safe = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const nameRe = new RegExp(`name="${safe}"`);
  while((m = re.exec(xml))){ if(nameRe.test(m[0])) return { block: m[0], index: m.index }; }
  return null;
}
function ensureAutofitBodyPr(bodyPrXml){
  if(!bodyPrXml) return '<a:bodyPr><a:normAutofit/></a:bodyPr>';
  let b = bodyPrXml.replace(/<a:(noAutofit|normAutofit|spAutoFit)\s*\/>/g, '');
  if(/\/>\s*$/.test(b)) b = b.replace(/\/>\s*$/, '><a:normAutofit/></a:bodyPr>');
  else b = b.replace('</a:bodyPr>', '<a:normAutofit/></a:bodyPr>');
  return b;
}
function replaceWholeShapeText(spBlock, value){
  const tbMatch = spBlock.match(/<p:txBody>([\s\S]*?)<\/p:txBody>/);
  if(!tbMatch) return spBlock;
  const tbInner = tbMatch[1];
  const bodyPrMatch = tbInner.match(/<a:bodyPr[^>]*(?:\/>|>[\s\S]*?<\/a:bodyPr>)/);
  const lstStyleMatch = tbInner.match(/<a:lstStyle\s*\/>|<a:lstStyle>[\s\S]*?<\/a:lstStyle>/);
  const firstParaMatch = tbInner.match(/<a:p>[\s\S]*?<\/a:p>/);
  let rPr = '', pPr = '';
  if(firstParaMatch){
    const pPrMatch = firstParaMatch[0].match(/<a:pPr[^>]*(?:\/>|>[\s\S]*?<\/a:pPr>)/);
    pPr = pPrMatch ? pPrMatch[0] : '';
    const runMatch = firstParaMatch[0].match(/<a:r>((?:<a:rPr[^>]*\/>)|(?:<a:rPr[^>]*>[\s\S]*?<\/a:rPr>))?<a:t>/);
    rPr = runMatch ? (runMatch[1] || '') : '';
  }
  const bodyPr = ensureAutofitBodyPr(bodyPrMatch ? bodyPrMatch[0] : null);
  const runsXml = cleanText(value).split('\n').map(line => `<a:r>${rPr}<a:t>${escapeXml(line)}</a:t></a:r>`).join('<a:br/>');
  const newTb = `<p:txBody>${bodyPr}${lstStyleMatch ? lstStyleMatch[0] : '<a:lstStyle/>'}<a:p>${pPr}${runsXml}</a:p></p:txBody>`;
  return spBlock.replace(tbMatch[0], () => newTb);
}
async function setFieldText(zip, shapeName, value){
  let xml = await zip.files[SLIDE_KEY].async('string');
  const found = findShapeBlockByName(xml, shapeName);
  if(!found) return false;
  const newBlock = replaceWholeShapeText(found.block, value || '');
  xml = xml.slice(0, found.index) + newBlock + xml.slice(found.index + found.block.length);
  zip.file(SLIDE_KEY, xml);
  return true;
}
async function getFieldText(zip, shapeName){
  const xml = await zip.files[SLIDE_KEY].async('string');
  const found = findShapeBlockByName(xml, shapeName);
  if(!found) return '';
  const tb = found.block.match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
  if(!tb) return '';
  const parts = tb[0].split(/<a:br\s*\/>/);
  const lines = parts.map(p => [...p.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m => m[1]).join(''));
  return lines.join('\n').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}

/* ---------- photos: no placeholder shapes exist, insert a <p:pic> at fixed coords ---------- */
async function nextMediaIndex(zip){
  const nums = Object.keys(zip.files).map(k => k.match(/^ppt\/media\/image(\d+)\./)).filter(Boolean).map(m => parseInt(m[1], 10));
  return (nums.length ? Math.max(...nums) : 0) + 1;
}
async function nextShapeIdFromXml(xml){
  const ids = [...xml.matchAll(/<p:cNvPr id="(\d+)"/g)].map(m => parseInt(m[1],10));
  return (ids.length ? Math.max(...ids) : 0) + 1;
}
async function ensureContentType(zip, ext, contentType){
  const key = '[Content_Types].xml';
  let xml = await zip.files[key].async('string');
  if(!new RegExp(`Extension="${ext}"`).test(xml)){
    xml = xml.replace('</Types>', () => `<Default Extension="${ext}" ContentType="${contentType}"/></Types>`);
    zip.file(key, xml);
  }
}
async function addImageAsset(zip, dataUrl){
  const idx = await nextMediaIndex(zip);
  const mime = dataUrl.slice(5, dataUrl.indexOf(';'));
  const ext = mime === 'image/png' ? 'png' : 'jpeg';
  const base64 = dataUrl.split(',')[1];
  zip.file(`ppt/media/image${idx}.${ext}`, base64, { base64: true });
  await ensureContentType(zip, ext, `image/${ext}`);
  const relsKey = 'ppt/slides/_rels/slide1.xml.rels';
  let relsXml = zip.files[relsKey]
    ? await zip.files[relsKey].async('string')
    : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  const existingIds = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m => parseInt(m[1],10));
  const rId = 'rId' + ((existingIds.length ? Math.max(...existingIds) : 0) + 1);
  relsXml = relsXml.replace('</Relationships>', () =>
    `<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${idx}.${ext}"/></Relationships>`);
  zip.file(relsKey, relsXml);
  return { rId, ext, idx };
}
async function insertPhotoAtCoords(zip, x, y, cx, cy, dataUrl, altTextTag){
  let xml = await zip.files[SLIDE_KEY].async('string');
  const { rId } = await addImageAsset(zip, dataUrl);
  const shapeId = await nextShapeIdFromXml(xml);
  const picXml = `<p:pic><p:nvPicPr><p:cNvPr id="${shapeId}" name="Photo_${altTextTag}" descr="${altTextTag}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
  xml = xml.replace('</p:spTree>', () => picXml + '</p:spTree>');
  zip.file(SLIDE_KEY, xml);
  return true;
}
async function findExistingPhotoDataUrl(zip, altPrefix){
  const xml = await zip.files[SLIDE_KEY].async('string');
  const pics = [...xml.matchAll(/<p:pic>[\s\S]*?<\/p:pic>/g)];
  const target = pics.find(m => { const d = m[0].match(/descr="([^"]*)"/); return d && d[1].startsWith(altPrefix); });
  if(!target) return null;
  const rIdMatch = target[0].match(/r:embed="([^"]+)"/);
  if(!rIdMatch) return null;
  const relsXml = await zip.files['ppt/slides/_rels/slide1.xml.rels'].async('string');
  const relMatch = relsXml.match(new RegExp(`Id="${rIdMatch[1]}"[^>]*Target="([^"]+)"`));
  if(!relMatch) return null;
  const mediaPath = 'ppt/' + relMatch[1].replace(/^\.\.\//, '');
  const ext = mediaPath.split('.').pop().toLowerCase();
  const mime = ext === 'png' ? 'image/png' : 'image/jpeg';
  const base64 = await zip.files[mediaPath].async('base64');
  return `data:${mime};base64,${base64}`;
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad2(n){ return n.toString().padStart(2,'0'); }
function generateUniqueNo(){
  const d = new Date();
  return `${pad2(d.getDate())}${MONTHS[d.getMonth()]}${String(d.getFullYear()).slice(-2)}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
}
function sanitizePart(s){ return (s || 'NA').toString().trim().replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'') || 'NA'; }

/* ---------- image resize ---------- */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = e.target.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let photoData = { before: null, after: null };
function wirePhotoButtons(prefix){
  const preview = document.getElementById(`preview_${prefix}`);
  const wire = (btnId, inputId) => {
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 1600, 0.82);
        photoData[prefix] = dataUrl;
        preview.src = dataUrl;
        preview.style.display = 'block';
      } catch(err){ console.error(err); }
    });
  };
  wire(`cam_${prefix}`, `camInput_${prefix}`);
  wire(`gal_${prefix}`, `galInput_${prefix}`);
}

function base64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

/* ---------- Continue an existing Kaizen (reads the hidden notes-slide JSON) ---------- */
document.getElementById('continueBtn').addEventListener('click', () => document.getElementById('continueInput').click());
document.getElementById('continueInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  const status = document.getElementById('statusLine');
  if(!file) return;
  status.textContent = 'Reading existing file...';
  status.className = 'status-line';
  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);

    const notesKey = Object.keys(zip.files).find(k => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(k));
    if(notesKey){
      const nxml = await zip.files[notesKey].async('string');
      const joined = [...nxml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m => m[1]).join('')
        .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      const s = joined.lastIndexOf('KZCAP_DATA_START'), en = joined.indexOf('KZCAP_DATA_END', s);
      if(s !== -1 && en !== -1){
        const payload = JSON.parse(joined.slice(s + 16, en));
        Object.keys(payload.fields || {}).forEach(key => {
          const el = document.getElementById('f_' + key) || document.getElementById('tag_' + key);
          if(el) el.value = payload.fields[key];
        });
      }
    }

    const beforeUrl = await findExistingPhotoDataUrl(zip, 'B_');
    if(beforeUrl){ photoData.before = beforeUrl; const p = document.getElementById('preview_before'); p.src = beforeUrl; p.style.display='block'; }
    const afterUrl = await findExistingPhotoDataUrl(zip, 'A_');
    if(afterUrl){ photoData.after = afterUrl; const p = document.getElementById('preview_after'); p.src = afterUrl; p.style.display='block'; }

    status.textContent = `Loaded "${file.name}" ✓ — edit and download again when ready.`;
    status.className = 'status-line ok';
  } catch(err){
    console.error(err);
    status.textContent = 'Could not read that file — is it a Kaizen Capture PPT?';
    status.className = 'status-line err';
  }
  e.target.value = '';
});

/* ---------- Google Sheet logging ---------- */
async function logToGoogleSheet(values){
  if(!GOOGLE_SHEET_WEBAPP_URL) return { skipped: true };
  try{
    await fetch(GOOGLE_SHEET_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(values)
    });
    return { ok: true };
  } catch(err){
    console.error('Google Sheet logging failed:', err);
    return { ok: false };
  }
}

  btn.disabled = true;
  status.textContent = 'Building your file...';
  status.className = 'status-line';

  try{
    if(typeof JSZip === 'undefined') throw new Error('File library failed to load — check your internet connection.');

    const uniqueNo = generateUniqueNo();
    const values = { uniqueNo };
    dynamicTagFields.forEach(f => { values[f.key] = document.getElementById('tag_' + f.key).value || ''; });
    PLAIN_FIELD_MAP.forEach(([elId, label]) => { values[elId.replace('f_','')] = document.getElementById(elId).value || ''; });
    BEFORE_AFTER_SHAPES.forEach(([elId]) => { values[elId.replace('f_','')] = document.getElementById(elId).value || ''; });

    const zip = await loadTemplateZip();

    for(const f of dynamicTagFields){ await setTagField(zip, f, document.getElementById('tag_' + f.key).value || ''); }
    for(const [elId, label] of PLAIN_FIELD_MAP){ await appendValueToLabel(zip, label, document.getElementById(elId).value || '', ': '); }
    for(const [elId, shapeName] of BEFORE_AFTER_SHAPES){ await setFieldText(zip, shapeName, document.getElementById(elId).value || ''); }
    await setFieldText(zip, 'KZCAP_FIELD_kaizenNo', uniqueNo);

    if(photoData.before) await insertPhotoAtCoords(zip, PHOTO_BOX.before.x, PHOTO_BOX.before.y, PHOTO_BOX.before.cx, PHOTO_BOX.before.cy, photoData.before, `B_${uniqueNo}`);
    if(photoData.after)  await insertPhotoAtCoords(zip, PHOTO_BOX.after.x,  PHOTO_BOX.after.y,  PHOTO_BOX.after.cx,  PHOTO_BOX.after.cy,  photoData.after,  `A_${uniqueNo}`);

    // hidden notes-slide metadata, for Continue + Summary Builder
    const notesKeys = Object.keys(zip.files).filter(k => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(k));
    if(notesKeys.length){
      const notesKey = notesKeys[0];
      let nxml = await zip.files[notesKey].async('string');
      const fieldLabels = { uniqueNo: 'Unique No.' };
      dynamicTagFields.forEach(f => { fieldLabels[f.key] = f.tag; });
      PLAIN_FIELD_MAP.forEach(([elId, label]) => { fieldLabels[elId.replace('f_','')] = label; });
      BEFORE_AFTER_SHAPES.forEach(([elId]) => { fieldLabels[elId.replace('f_','')] = elId.replace('f_',''); });
      const payload = { app: 'kaizen-capture-template', template: 'KaizenCapture', generatedAt: new Date().toISOString(), fields: values, fieldLabels, photos: { before_photo: !!photoData.before, after_photo: !!photoData.after } };
      const marker = `KZCAP_DATA_START${JSON.stringify(payload)}KZCAP_DATA_END`;
      const phMatch = nxml.match(/<p:sp>(?:(?!<\/p:sp>)[\s\S])*?<p:ph type="body"[^>]*\/>[\s\S]*?<\/p:sp>/);
      if(phMatch){
        const tbMatch = phMatch[0].match(/<p:txBody>[\s\S]*?<\/p:txBody>/);
        if(tbMatch){
          const newPara = `<a:p><a:r><a:rPr lang="en-US" sz="100"/><a:t>${escapeXml(marker)}</a:t></a:r></a:p>`;
          // remove any old Kaizen data paragraphs first, so only ONE data block ever exists
          const cleanedTb = tbMatch[0].replace(/<a:p>(?:(?!<\/a:p>)[\s\S])*?KZCAP_DATA_START(?:(?!<\/a:p>)[\s\S])*?<\/a:p>/g, () => '');
          const newTb = cleanedTb.replace('</p:txBody>', () => newPara + '</p:txBody>');
          nxml = nxml.replace(phMatch[0], () => phMatch[0].replace(tbMatch[0], () => newTb));
          zip.file(notesKey, nxml);
        }
      }
    }

    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }, mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    const fileName = `${sanitizePart(values.doneBy)}_${sanitizePart(values.dept)}_${sanitizePart(values.plant)}_${uniqueNo}.pptx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 120000);

    const sheetResult = await logToGoogleSheet(values);
    status.textContent = sheetResult.skipped
      ? `Downloaded ${fileName} ✓ (Google Sheet logging not configured)`
      : sheetResult.ok
        ? `Downloaded ${fileName} ✓ — logged to Google Sheet ✓`
        : `Downloaded ${fileName} ✓ (Google Sheet logging failed)`;
    status.className = 'status-line ok';
  } catch(err){
    console.error(err);
    status.textContent = err.message || 'Something went wrong — see console.';
    status.className = 'status-line err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
